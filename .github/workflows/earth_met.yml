name: Generate Wind Textures

on:
  schedule:
    # Runs at 05:00, 11:00, 17:00, and 23:00 UTC
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write # Required to commit and push generated textures back to the repo

jobs:
  generate-textures:
    runs-on: macos-latest # Runs on macOS instead of Ubuntu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install macOS system dependencies (eccodes for GRIB2 via Homebrew)
        run: |
          brew update
          brew install eccodes

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install herbie-data xarray cfgrib pillow numpy scipy

      - name: Run texture generator script
        run: |
          python download.py

      - name: Commit and push updated textures in a single commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage all generated output inside the textures directory
          git add textures/
          
          # Commit only if there are actual texture changes
          if ! git diff --cached --quiet; then
            git commit -m "update: automated wind texture frames update [skip ci]"
            git push
          else
            echo "No texture changes detected, skipping commit."
          fi
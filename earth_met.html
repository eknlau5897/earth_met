<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Earth met 3D - Thick Wind Particles (0-115 kts)</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #02040a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      touch-action: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    
    #ui-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 300px;
      max-height: 85vh;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      z-index: 10;
    }

    #ui-panel::-webkit-scrollbar { width: 4px; }
    #ui-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #38bdf8;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .control-group { margin-bottom: 8px; }
    .control-group:last-child { margin-bottom: 0; }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    select {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 6px;
      outline: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
      outline: none;
      margin: 4px 0;
      accent-color: #38bdf8;
    }

    .slider-val {
      color: #38bdf8;
      font-weight: 600;
      font-family: monospace;
    }

    .time-info {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 6px;
      padding: 6px 8px;
      margin-top: 4px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      margin-bottom: 2px;
    }
    .time-row:last-child { margin-bottom: 0; }
    .time-label { color: #94a3b8; }
    .time-value { color: #38bdf8; font-weight: 600; font-family: monospace; }

    #wind-popup {
      position: absolute;
      display: none;
      transform: translate(-50%, -100%);
      margin-top: -10px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 12px rgba(56, 189, 248, 0.5);
      z-index: 20;
      pointer-events: none;
      min-width: 130px;
    }
    #wind-popup::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #38bdf8 transparent;
      display: block;
      width: 0;
    }
    .popup-title {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 3px;
      margin-bottom: 4px;
    }
    .popup-val {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      font-family: monospace;
    }
    .popup-sub {
      font-size: 10px;
      color: #cbd5e1;
      margin-top: 2px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://d3js.org/topojson.v3.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="wind-popup">
    <div class="popup-title" id="pop-coords">0.0°N, 0.0°E</div>
    <div class="popup-val" id="pop-speed">0.0 m/s</div>
    <div class="popup-sub" id="pop-extra">0.0 km/h | 0.0 kts</div>
  </div>

  <div id="ui-panel">
    <h2>Earth met 3D</h2>
    
    <div class="control-group">
      <label for="modelSelect">Model</label>
      <select id="modelSelect">
        <option value="gfs">GFS (NOAA 0.25°)</option>
        <option value="aigfs">AIGFS (Machine Learning)</option>
        <option value="ifs">ECMWF IFS</option>
        <option value="aifs">ECMWF AIFS</option>
      </select>
    </div>

    <div class="control-group">
      <label for="levelSelect">Pressure Level</label>
      <select id="levelSelect">
        <option value="10m" selected>Surface (10m)</option>
        <option value="925hPa">925 hPa (~750m)</option>
        <option value="850hPa">850 hPa (~1.5km)</option>
        <option value="700hPa">700 hPa (~3km)</option>
        <option value="500hPa">500 hPa (~5.5km)</option>
        <option value="200hPa">200 hPa (~12km / Jet Stream)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Forecast Step <span id="fxxVal" class="slider-val">+00h</span></label>
      <input type="range" id="fxxSlider" min="0" max="240" step="6" value="0">
      
      <div class="time-info">
        <div class="time-row">
          <span class="time-label">Run Cycle:</span>
          <span id="run-cycle-display" class="time-value">----</span>
        </div>
        <div class="time-row">
          <span class="time-label">Valid Time:</span>
          <span id="valid-time-display" class="time-value">----</span>
        </div>
      </div>
    </div>

    <div class="control-group">
      <label>Particles <span id="countVal" class="slider-val">50,000</span></label>
      <input type="range" id="countSlider" min="0" max="150000" step="2500" value="50000">
    </div>

    <div class="control-group">
      <label>Particle Size <span id="sizeVal" class="slider-val">0.020</span></label>
      <input type="range" id="sizeSlider" min="0.005" max="0.05" step="0.002" value="0.020">
    </div>

    <div class="control-group">
      <label>Speed <span id="speedVal" class="slider-val">0.80</span></label>
      <input type="range" id="speedSlider" min="0.1" max="2.0" step="0.05" value="0.8">
    </div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

    const hkLatRad = 22.3193 * (Math.PI / 180);
    const hkLonRad = 114.1694 * (Math.PI / 180);
    const camDist = 2.7;

    camera.position.set(
      -camDist * Math.cos(hkLatRad) * Math.cos(hkLonRad),
       camDist * Math.sin(hkLatRad),
       camDist * Math.cos(hkLatRad) * Math.sin(hkLonRad)
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- Solid Base Globe ---
    const globeGeo = new THREE.SphereGeometry(1.0, 64, 64);
    const globeMat = new THREE.MeshBasicMaterial({ color: 0x02040a });
    const globe = new THREE.Mesh(globeGeo, globeMat);
    scene.add(globe);

    // Pin Marker
    const pinGeo = new THREE.SphereGeometry(0.012, 16, 16);
    const pinMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const pinMesh = new THREE.Mesh(pinGeo, pinMat);
    pinMesh.visible = false;
    scene.add(pinMesh);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let inspectedPoint = null;

    const popup = document.getElementById('wind-popup');
    const popCoords = document.getElementById('pop-coords');
    const popSpeed = document.getElementById('pop-speed');
    const popExtra = document.getElementById('pop-extra');

    // --- Coastlines ---
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')
      .then(r => r.json())
      .then(topology => {
        const geojson = topojson.feature(topology, topology.objects.land);
        
        const mat = new THREE.LineBasicMaterial({ 
          color: 0xffffff,
          transparent: false,
          opacity: 1.0,
          depthTest: true
        });

        const group = new THREE.Group();
        const features = geojson.type === 'FeatureCollection' ? geojson.features : [geojson];

        features.forEach(feature => {
          if (!feature.geometry) return;
          const coords = feature.geometry.type === 'MultiPolygon' ? feature.geometry.coordinates : [feature.geometry.coordinates];

          coords.forEach(polygon => {
            polygon.forEach(ring => {
              const points = [];
              ring.forEach(pt => {
                const lon = pt[0], lat = pt[1];
                const phi = (90 - lat) * (Math.PI / 180);
                const theta = (lon + 180) * (Math.PI / 180);
                const r = 1.004;
                points.push(new THREE.Vector3(
                  -r * Math.sin(phi) * Math.cos(theta),
                  r * Math.cos(phi),
                  r * Math.sin(phi) * Math.sin(theta)
                ));
              });

              if (points.length > 1) {
                group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), mat));
              }
            });
          });
        });
        scene.add(group);
      });

    // --- Soft Circle Glow Texture Generator for Thick Particles ---
    function createParticleTexture() {
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 64;
      pCanvas.height = 64;
      const ctx = pCanvas.getContext('2d');

      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1.0)');
      grad.addColorStop(0.3, 'rgba(255,255,255,0.8)');
      grad.addColorStop(0.7, 'rgba(255,255,255,0.2)');
      grad.addColorStop(1, 'rgba(255,255,255,0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);

      const texture = new THREE.CanvasTexture(pCanvas);
      texture.needsUpdate = true;
      return texture;
    }

    // --- Particle Wind System (Using Points for Custom Thickness) ---
    const MAX_PARTICLES = 150000;
    let particleCount = 50000;
    let particleSize = 0.020;
    
    const pointGeo = new THREE.BufferGeometry();
    const pointPositions = new Float32Array(MAX_PARTICLES * 3);
    const pointColors = new Float32Array(MAX_PARTICLES * 3);

    const particleLats = new Float32Array(MAX_PARTICLES);
    const particleLons = new Float32Array(MAX_PARTICLES);
    const particleAges = new Float32Array(MAX_PARTICLES);
    const particleMaxAges = new Float32Array(MAX_PARTICLES);

    function resetParticle(i) {
      particleLats[i] = Math.asin(2.0 * Math.random() - 1.0);
      particleLons[i] = Math.random() * 2.0 * Math.PI - Math.PI;
      particleAges[i] = 0;
      particleMaxAges[i] = 60 + Math.random() * 90;
    }

    for (let i = 0; i < MAX_PARTICLES; i++) {
      resetParticle(i);
      particleAges[i] = Math.floor(Math.random() * particleMaxAges[i]);
    }

    pointGeo.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));
    pointGeo.setAttribute('color', new THREE.BufferAttribute(pointColors, 3));

    const pointMat = new THREE.PointsMaterial({
      size: particleSize,
      map: createParticleTexture(),
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
      depthTest: true,
      depthWrite: false,
      sizeAttenuation: true
    });

    const windPoints = new THREE.Points(pointGeo, pointMat);
    scene.add(windPoints);

    // --- Particle Color function (0 - 115 knots) ---
    function getParticleWindyColor(speedMS) {
      const knots = speedMS * 1.94384;
      const norm = Math.min(1.0, Math.max(0.0, knots / 115.0));

      let r, g, b;
      if (norm < 0.13) {
        // 0 - 15 knots: Deep Navy to Soft Cyan
        const t = norm / 0.13;
        r = 0.0; g = 0.5 * t; b = 0.8 + 0.2 * t;
      } else if (norm < 0.30) {
        // 15 - 35 knots: Cyan to Emerald Green
        const t = (norm - 0.13) / 0.17;
        r = 0.0 + 0.1 * t; g = 0.5 + 0.5 * t; b = 1.0 - 0.7 * t;
      } else if (norm < 0.48) {
        // 35 - 55 knots: Green to Warm Yellow
        const t = (norm - 0.30) / 0.18;
        r = 0.1 + 0.9 * t; g = 1.0; b = 0.3 - 0.3 * t;
      } else if (norm < 0.70) {
        // 55 - 80 knots: Yellow to Deep Coral Red
        const t = (norm - 0.48) / 0.22;
        r = 1.0; g = 1.0 - 0.85 * t; b = 0.05 * t;
      } else {
        // 80 - 115+ knots: Red to Violet Magenta
        const t = (norm - 0.70) / 0.30;
        r = 1.0 - 0.2 * t; g = 0.15 * (1.0 - t); b = 0.05 + 0.85 * t;
      }
      
      return [Math.min(1.2, r * 1.25), Math.min(1.2, g * 1.25), Math.min(1.2, b * 1.25)];
    }

    let currentModel = 'gfs';
    let currentLevel = '10m';
    let currentFxx = 0;
    let speedFactor = 0.8;
    let pixelData = null;
    let metaData = null;
    let globalCycleStr = null;

    function sampleWindBilinear(latDeg, lonDeg) {
      if (!pixelData || !metaData) return { u: 0, v: 0, speed: 0 };

      const w = metaData.width;
      const h = metaData.height;
      const needsEcmwfOffset = (currentModel === 'ifs' || currentModel === 'aifs');

      let sampleLonDeg = lonDeg;
      if (needsEcmwfOffset) {
        sampleLonDeg = (sampleLonDeg + 180) % 360;
        if (sampleLonDeg < 0) sampleLonDeg += 360;
      }

      const gx = ((sampleLonDeg + 180) / 360) * (w - 1);
      const gy = ((90 - latDeg) / 180) * (h - 1);

      const x0 = Math.floor(gx), x1 = Math.min(x0 + 1, w - 1);
      const y0 = Math.floor(gy), y1 = Math.min(y0 + 1, h - 1);

      const tx = gx - x0;
      const ty = gy - y0;

      function getUV(px, py) {
        const idx = (py * w + px) * 4;
        const uNorm = pixelData[idx] / 255.0;
        const vNorm = pixelData[idx + 1] / 255.0;
        return {
          u: metaData.uMin + uNorm * (metaData.uMax - metaData.uMin),
          v: metaData.vMin + vNorm * (metaData.vMax - metaData.vMin)
        };
      }

      const c00 = getUV(x0, y0);
      const c10 = getUV(x1, y0);
      const c01 = getUV(x0, y1);
      const c11 = getUV(x1, y1);

      const u = (1 - tx) * (1 - ty) * c00.u + tx * (1 - ty) * c10.u + (1 - tx) * ty * c01.u + tx * ty * c11.u;
      const v = (1 - tx) * (1 - ty) * c00.v + tx * (1 - ty) * c10.v + (1 - tx) * ty * c01.v + tx * ty * c11.v;

      return { u, v, speed: Math.sqrt(u * u + v * v) };
    }

    function formatUTCDate(date) {
      const yyyy = date.getUTCFullYear();
      const mm = String(date.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(date.getUTCDate()).padStart(2, '0');
      const hh = String(date.getUTCHours()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:00 UTC`;
    }

    function updateTimeUI() {
      if (!globalCycleStr) return;

      const baseDate = new Date(globalCycleStr.replace(' ', 'T') + ':00Z');
      if (!isNaN(baseDate.getTime())) {
        document.getElementById('run-cycle-display').innerText = formatUTCDate(baseDate);
        const validDate = new Date(baseDate.getTime() + currentFxx * 3600 * 1000);
        document.getElementById('valid-time-display').innerText = formatUTCDate(validDate);
      } else {
        document.getElementById('run-cycle-display').innerText = globalCycleStr;
        document.getElementById('valid-time-display').innerText = `+${currentFxx}h`;
      }
    }

    async function loadFrame(model, level, fxx) {
      const padFxx = String(fxx).padStart(3, '0');
      const basePath = `textures/${model}_${level}_${padFxx}`;

      try {
        const metaRes = await fetch(`${basePath}.json`, { cache: 'no-cache' });
        if (!metaRes.ok) throw new Error(`HTTP ${metaRes.status}`);
        metaData = await metaRes.json();

        if (metaData.cycle) {
          globalCycleStr = metaData.cycle;
          updateTimeUI();
        }

        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error('PNG unavailable'));
          i.src = `${basePath}.png`;
        });

        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        pixelData = ctx.getImageData(0, 0, img.width, img.height).data;
        updatePopupData();
      } catch (e) {
        console.warn(`Frame pending: ${e.message}`);
        pixelData = null;
        metaData = null;
        popup.style.display = 'none';
        pinMesh.visible = false;
      }
    }

    function getSpherePos(latRad, lonRad, r = 1.008) {
      return {
        x: -r * Math.cos(latRad) * Math.cos(lonRad),
        y:  r * Math.sin(latRad),
        z:  r * Math.cos(latRad) * Math.sin(lonRad)
      };
    }

    function updatePopupData() {
      if (!inspectedPoint || !pixelData || !metaData) return;

      const lat = inspectedPoint.lat;
      const lon = inspectedPoint.lon;
      const wind = sampleWindBilinear(lat, lon);

      if (wind) {
        const latStr = `${Math.abs(lat).toFixed(1)}°${lat >= 0 ? 'N' : 'S'}`;
        const lonStr = `${Math.abs(lon).toFixed(1)}°${lon >= 0 ? 'E' : 'W'}`;
        
        popCoords.innerText = `${latStr}, ${lonStr}`;
        popSpeed.innerText = `${wind.speed.toFixed(1)} m/s`;
        
        const kmh = (wind.speed * 3.6).toFixed(1);
        const kts = (wind.speed * 1.94384).toFixed(1);
        popExtra.innerText = `${kmh} km/h | ${kts} kts`;

        popup.style.display = 'block';
      }
    }

    let pointerDownPos = { x: 0, y: 0 };
    window.addEventListener('pointerdown', e => { pointerDownPos = { x: e.clientX, y: e.clientY }; });
    window.addEventListener('pointerup', e => {
      const dx = Math.abs(e.clientX - pointerDownPos.x);
      const dy = Math.abs(e.clientY - pointerDownPos.y);

      if (dx < 5 && dy < 5) {
        if (e.target.closest('#ui-panel')) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(globe);

        if (intersects.length > 0) {
          const pt = intersects[0].point.clone().normalize();
          const latRad = Math.asin(pt.y);
          const lonRad = Math.atan2(pt.z, -pt.x);

          inspectedPoint = { 
            lat: latRad * (180 / Math.PI), 
            lon: lonRad * (180 / Math.PI), 
            worldPos: intersects[0].point 
          };

          pinMesh.position.copy(pt.multiplyScalar(1.008));
          pinMesh.visible = true;
          updatePopupData();
        } else {
          popup.style.display = 'none';
          pinMesh.visible = false;
          inspectedPoint = null;
        }
      }
    });

    // --- Render Loop ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (inspectedPoint && popup.style.display !== 'none') {
        const tempV = inspectedPoint.worldPos.clone().multiplyScalar(1.01);
        tempV.project(camera);

        if (tempV.z > 1) {
          popup.style.display = 'none';
        } else {
          const x = (tempV.x *  .5 + .5) * window.innerWidth;
          const y = (tempV.y * -.5 + .5) * window.innerHeight;
          popup.style.left = `${x}px`;
          popup.style.top = `${y}px`;
          popup.style.display = 'block';
        }
      }

      if (pixelData && metaData && particleCount > 0) {
        const pos = pointGeo.attributes.position.array;
        const col = pointGeo.attributes.color.array;
        const step = 0.00045 * speedFactor;

        for (let i = 0; i < particleCount; i++) {
          particleAges[i]++;
          if (particleAges[i] >= particleMaxAges[i]) {
            resetParticle(i);
            continue;
          }

          let latRad = particleLats[i];
          let lonRad = particleLons[i];

          const latDeg = latRad * (180 / Math.PI);
          const lonDeg = lonRad * (180 / Math.PI);

          const wind = sampleWindBilinear(latDeg, lonDeg);

          const effU = Math.sign(wind.u || 1.0) * Math.max(Math.abs(wind.u), 2.0);
          const effV = Math.sign(wind.v || 1.0) * Math.max(Math.abs(wind.v), 2.0);

          const cosLat = Math.max(0.05, Math.cos(latRad));
          lonRad += (effU * step) / cosLat;
          latRad += effV * step;

          if (lonRad > Math.PI) lonRad -= 2 * Math.PI;
          if (lonRad < -Math.PI) lonRad += 2 * Math.PI;

          if (Math.abs(latRad) > (88 * Math.PI / 180)) {
            resetParticle(i);
            continue;
          }

          particleLats[i] = latRad;
          particleLons[i] = lonRad;

          const head = getSpherePos(latRad, lonRad, 1.008);

          const pIdx = i * 3;
          pos[pIdx]     = head.x; 
          pos[pIdx + 1] = head.y; 
          pos[pIdx + 2] = head.z;

          const lifeProgress = particleAges[i] / particleMaxAges[i];
          const alpha = Math.sin(lifeProgress * Math.PI);

          const [cr, cg, cb] = getParticleWindyColor(wind.speed);

          col[pIdx]     = cr * alpha;
          col[pIdx + 1] = cg * alpha;
          col[pIdx + 2] = cb * alpha;
        }

        pointGeo.setDrawRange(0, particleCount);
        pointGeo.attributes.position.needsUpdate = true;
        pointGeo.attributes.color.needsUpdate = true;
      } else {
        pointGeo.setDrawRange(0, 0);
      }

      renderer.render(scene, camera);
    }

    document.getElementById('modelSelect').addEventListener('change', e => {
      currentModel = e.target.value;
      loadFrame(currentModel, currentLevel, currentFxx);
    });

    document.getElementById('levelSelect').addEventListener('change', e => {
      currentLevel = e.target.value;
      loadFrame(currentModel, currentLevel, currentFxx);
    });

    document.getElementById('fxxSlider').addEventListener('input', e => {
      currentFxx = parseInt(e.target.value);
      document.getElementById('fxxVal').innerText = `+${String(currentFxx).padStart(2, '0')}h`;
      updateTimeUI();
      loadFrame(currentModel, currentLevel, currentFxx);
    });

    document.getElementById('speedSlider').addEventListener('input', e => {
      speedFactor = parseFloat(e.target.value);
      document.getElementById('speedVal').innerText = speedFactor.toFixed(2);
    });

    document.getElementById('sizeSlider').addEventListener('input', e => {
      particleSize = parseFloat(e.target.value);
      pointMat.size = particleSize;
      document.getElementById('sizeVal').innerText = particleSize.toFixed(3);
    });

    document.getElementById('countSlider').addEventListener('input', e => {
      particleCount = parseInt(e.target.value);
      document.getElementById('countVal').innerText = particleCount.toLocaleString();
    });

    fetch('textures/manifest.json', { cache: 'no-cache' })
      .then(r => r.json())
      .then(m => {
        globalCycleStr = m.cycle;
        updateTimeUI();
      })
      .catch(() => {
        document.getElementById('run-cycle-display').innerText = 'Pending...';
      });

    loadFrame(currentModel, currentLevel, currentFxx);
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
